common:
    lid_topic:  "/points_raw"
    imu_topic:  "/imu_raw"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    
preprocess:
    lidar_type: 4                # 4 for beike 
    scan_line: 8
    blind: 0.5

mapping:
    acc_cov: 0.02
    gyr_cov: 0.01
    b_acc_cov: 0.001
    b_gyr_cov: 0.001
    fov_degree:    360
    det_range:     200
    timestamp_unit: 3       # NS单位
    extrinsic_est_en: false

    # kws_imu /imu_new
    # extrinsic_T: [ 0.043, -0.057, -0.015]
    # extrinsic_R: [  1, 0, 0,
    #                 0, -1, 0,
    #                 0, 0, -1]

    # 外部imu /imu
    # extrinsic_T: [ 0, 0.105, 0]
    # extrinsic_R: [  -1, 0, 0,
    #                 0, 1, 0,
    #                 0, 0, -1]

    # 内部imu /imu_raw
    extrinsic_T: [ -0.011, -0.028, 0.028 ]
    extrinsic_R: [  1, 0, 0,
                    0, -1, 0,
                    0, 0, -1]
publish:     
    path_en:  true
    scan_publish_en:  true       # 'false' will close all the point cloud output
    dense_publish_en: true       # false will low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # output the point cloud scans in IMU-body-frame
pcd_save:
    pcd_save_en: true
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
